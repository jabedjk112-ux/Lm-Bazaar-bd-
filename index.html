<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LM Bazar BD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🛒 LM Bazar BD</h1>
    <div class="header-icons">
      <span onclick="showOrders()">📦 অর্ডার</span>
      <span onclick="showCart()">🛒 <span id="cartCount">0</span></span>
      <span id="userDisplay" onclick="toggleLogin()">👤 লগইন</span>
    </div>
  </header>

  <!-- লগইন মডাল -->
  <div id="loginModal" class="modal">
    <div class="modal-content small">
      <h2>লগইন / রেজিস্ট্রেশন</h2>
      <input type="text" id="username" placeholder="ব্যবহারকারীর নাম" />
      <button onclick="login()">প্রবেশ করুন</button>
      <button class="close-btn" onclick="hideLogin()">বন্ধ করুন</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="পণ্য খুঁজুন..." onkeyup="filterProducts()" />
  </div>

  <div id="productList" class="product-grid"></div>

  <!-- কার্ট মডাল -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <h2>আপনার কার্ট</h2>
      <ul id="cartItems"></ul>
      <p><strong>মোট:</strong> ৳<span id="cartTotal">0</span></p>
      <button onclick="checkout()">অর্ডার করুন</button>
      <button class="close-btn" onclick="hideCart()">বন্ধ করুন</button>
    </div>
  </div>

  <!-- অর্ডার হিস্টোরি মডাল -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <h2>আপনার অর্ডার হিস্টোরি</h2>
      <ul id="orderList"></ul>
      <button class="close-btn" onclick="hideOrders()">বন্ধ করুন</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
